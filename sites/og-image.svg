<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="80" y="80" width="80" height="80" rx="16" fill="url(#accent)" filter="url(#glow)"/>
  <text x="120" y="138" text-anchor="middle" fill="white" font-size="48" font-weight="bold" font-family="monospace">D</text>

  <text x="180" y="140" fill="#e4e4e7" font-size="64" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif" letter-spacing="-2">Devo</text>

  <text x="80" y="240" fill="#a1a1aa" font-size="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif">对话驱动的自主编码智能体</text>

  <text x="80" y="320" fill="url(#accent)" font-size="48" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif" letter-spacing="-1">你说需求，AI 干活。</text>

  <text x="80" y="400" fill="#71717a" font-size="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif" line-height="1.6">
    <tspan x="80" dy="0">它自己写文件、跑命令、看报错、自己修，直到搞定。</tspan>
    <tspan x="80" dy="36">你只需要在它要动手的时候点个头就行。</tspan>
  </text>

  <line x1="80" y1="480" x2="1120" y2="480" stroke="#2a2a3d" stroke-width="1"/>

  <text x="80" y="540" fill="#6366f1" font-size="18" font-weight="600" font-family="monospace">#</text>

  <rect x="960" y="510" width="160" height="40" rx="20" fill="#6366f1"/>
  <text x="1040" y="536" text-anchor="middle" fill="white" font-size="16" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,sans-serif">即将发布</text>
</svg>